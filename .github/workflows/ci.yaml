# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: ci
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # A compile gate, not a test suite: there are no tests yet. `npm run
      # build` runs tsc itself, but running it separately makes a type error
      # fail on its own step rather than inside the bundler's output.
      - run: npx tsc --noEmit
      - run: npm run build
